# Relais SMTP de GO-Mat (copie isolée de celui de Mannyx, avec sa propre clé)
app = 'gomat-smtp-relay'
primary_region = 'cdg'

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  ALLOWED_SMTP_HOSTS = 'mail.infomaniak.com'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpus = 1
