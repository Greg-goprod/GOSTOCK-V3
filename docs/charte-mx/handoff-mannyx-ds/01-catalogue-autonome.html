n class=\"tag-chip\">Headliner<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);margin-bottom:10px;\">ASSIGNÉ À<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;\">\n            <div style=\"width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;\">CV<\u002Fdiv>\n            <div>\n              <div style=\"font-size:12px;font-weight:600;color:var(--text);\">C. Vidal<\u002Fdiv>\n              <div style=\"font-size:10px;color:var(--text-muted);\">Booking Manager<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto;padding-top:16px;border-top:1px solid var(--border);\">\n            <button onclick=\"closePreview()\" class=\"btn btn-ghost\" style=\"width:100%;justify-content:center;font-size:12px;\">Fermer<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n  }\n\n  overlay.classList.add('open');\n}\n\nfunction closePreview() {\n  const ov = document.getElementById('pv-overlay');\n  if (ov) ov.classList.remove('open');\n}\ndocument.addEventListener('keydown', e => { if(e.key==='Escape') closePreview(); });\n\n\n// ── DROPDOWN ─────────────────────────────────────────────────────────────\ndocument.addEventListener('click', e => {\n  if (!e.target.closest('[id^=\"dd\"]') && !e.target.closest('[id^=\"ctx\"]') && !e.target.closest('.popover') && !e.target.closest('[onclick*=\"toggleDD\"]') && !e.target.closest('[onclick*=\"togglePop\"]')) {\n    document.querySelectorAll('.dropdown-menu, .popover').forEach(m => m.style.display = 'none');\n  }\n});\nfunction toggleDD(id) {\n  const el = document.getElementById(id);\n  const vis = el.style.display !== 'none';\n  document.querySelectorAll('.dropdown-menu').forEach(m => m.style.display = 'none');\n  el.style.display = vis ? 'none' : 'block';\n}\nfunction selectDD(id, item, labelId) {\n  document.querySelectorAll('#'+id+' .dd-item').forEach(i => i.classList.remove('dd-active'));\n  item.classList.add('dd-active');\n  if (labelId) document.getElementById(labelId).textContent = item.textContent.trim();\n  document.getElementById(id).style.display = 'none';\n}\nfunction togglePop(id) {\n  const el = document.getElementById(id);\n  const vis = el.style.display !== 'none';\n  document.querySelectorAll('.popover').forEach(p => p.style.display = 'none');\n  el.style.display = vis ? 'none' : 'block';\n}\n\n// ── COMMAND PALETTE ───────────────────────────────────────────────────────\nconst CP_ITEMS = [\n  {icon:'music',label:'David Guetta',sub:'Artiste · Mainstage',group:'Artistes'},\n  {icon:'music',label:'Bob Sinclar',sub:'Artiste · Riverstage',group:'Artistes'},\n  {icon:'music',label:'Clara Luciani',sub:'Artiste · Mainstage',group:'Artistes'},\n  {icon:'clipboard-list',label:'Contrat David Guetta',sub:'270 000 EUR · En attente',group:'Contrats'},\n  {icon:'clipboard-list',label:'Contrat Bob Sinclar',sub:'85 000 EUR · Signé',group:'Contrats'},\n  {icon:'user',label:'Marc Dupont',sub:'Agent · david@agency.com',group:'Contacts'},\n  {icon:'settings',label:'Paramètres du festival',sub:'VENOGE FESTIVAL 2026',group:'Navigation'},\n  {icon:'plus',label:'Ajouter un artiste',sub:'',group:'Actions'},\n  {icon:'share',label:'Exporter le lineup',sub:'PDF ou Excel',group:'Actions'},\n];\nlet cpActive = 0, cpQuery = '', cpFiltered = CP_ITEMS;\n\nfunction openCmdPal() {\n  let ov = document.getElementById('cmdpal-ov');\n  if (!ov) {\n    ov = document.createElement('div'); ov.id = 'cmdpal-ov'; ov.className = 'cmdpal-overlay';\n    ov.innerHTML = `<div class=\"cmdpal-box\" onclick=\"event.stopPropagation()\">\n      <input id=\"cp-input\" class=\"cmdpal-input\" placeholder=\"Rechercher artistes, contrats, actions…\" oninput=\"cpFilter(this.value)\" onkeydown=\"cpKey(event)\" autofocus>\n      <div id=\"cp-results\" style=\"max-height:340px;overflow-y:auto;padding-bottom:6px;\"><\u002Fdiv>\n      <div style=\"padding:8px 16px;border-top:1px solid var(--border);display:flex;gap:16px;\">\n        <span style=\"font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:4px;\"><kbd style=\"background:var(--surface2);border:1px solid var(--border);padding:1px 6px;border-radius:4px;font-size:10px;\">↑↓<\u002Fkbd> naviguer<\u002Fspan>\n        <span style=\"font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:4px;\"><kbd style=\"background:var(--surface2);border:1px solid var(--border);padding:1px 6px;border-radius:4px;font-size:10px;\">↵<\u002Fkbd> sélectionner<\u002Fspan>\n        <span style=\"font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:4px;\"><kbd style=\"background:var(--surface2);border:1px solid var(--border);padding:1px 6px;border-radius:4px;font-size:10px;\">Esc<\u002Fkbd> fermer<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n    ov.onclick = () => ov.classList.remove('open');\n    document.body.appendChild(ov);\n    document.addEventListener('keydown', e => {\n      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openCmdPal(); }\n    });\n  }\n  cpActive = 0; cpQuery = ''; cpFiltered = CP_ITEMS;\n  ov.classList.add('open');\n  setTimeout(() => { const inp = document.getElementById('cp-input'); if(inp){inp.value='';inp.focus();} cpRender(); }, 50);\n}\nfunction cpFilter(q) {\n  cpQuery = q.toLowerCase(); cpActive = 0;\n  cpFiltered = CP_ITEMS.filter(i => i.label.toLowerCase().includes(cpQuery) || i.sub.toLowerCase().includes(cpQuery) || i.group.toLowerCase().includes(cpQuery));\n  cpRender();\n}\nfunction cpRender() {\n  const container = document.getElementById('cp-results'); if(!container) return;\n  const groups = [...new Set(cpFiltered.map(i => i.group))];\n  container.innerHTML = groups.map(g => `\n    <div class=\"cmdpal-section\">\n      <div class=\"cmdpal-section-label\">${g}<\u002Fdiv>\n      ${cpFiltered.filter(i=>i.group===g).map((item,_,arr) => {\n        const globalIdx = cpFiltered.indexOf(item);\n        return `<div class=\"cmdpal-item ${globalIdx===cpActive?'cp-active':''}\" data-idx=\"${globalIdx}\" onclick=\"cpSelect(${globalIdx})\">\n          <div class=\"cp-icon\" style=\"background:var(--accent-lt);color:var(--accent)\">${icon(item.icon,{size:15})}<\u002Fdiv>\n          <div class=\"cp-label\">${item.label}<\u002Fdiv>\n          ${item.sub ? `<div class=\"cp-sub\">${item.sub}<\u002Fdiv>` : ''}\n        <\u002Fdiv>`;\n      }).join('')}\n    <\u002Fdiv>`).join('') || '<div style=\"padding:20px;text-align:center;font-size:13px;color:var(--text-muted);\">Aucun résultat<\u002Fdiv>';\n}\nfunction cpKey(e) {\n  if (e.key==='ArrowDown') { cpActive = Math.min(cpActive+1, cpFiltered.length-1); cpRender(); }\n  else if (e.key==='ArrowUp') { cpActive = Math.max(cpActive-1, 0); cpRender(); }\n  else if (e.key==='Enter') cpSelect(cpActive);\n  else if (e.key==='Escape') document.getElementById('cmdpal-ov')?.classList.remove('open');\n}\nfunction cpSelect(idx) {\n  document.getElementById('cmdpal-ov')?.classList.remove('open');\n}\n\n// ── UPLOAD ZONE ───────────────────────────────────────────────────────────\nfunction dzOver(e) { e.preventDefault(); e.currentTarget.classList.add('dz-over'); }\nfunction dzLeave(e) { e.currentTarget.classList.remove('dz-over'); }\nfunction dzDrop(e) { e.preventDefault(); e.currentTarget.classList.remove('dz-over'); }\nfunction dzInput(e) {}\n\n// ── DRAG & DROP LIST ──────────────────────────────────────────────────────\nlet dndDragging = null, dndDragIdx = null;\nfunction dndStart(e) { dndDragging = e.currentTarget; dndDragIdx = +e.currentTarget.dataset.idx; e.currentTarget.classList.add('dragging'); }\nfunction dndOver(e) { e.preventDefault(); document.querySelectorAll('.dnd-item').forEach(i=>i.classList.remove('drag-over')); e.currentTarget.classList.add('drag-over'); }\nfunction dndDrop(e) { e.preventDefault(); const list = document.getElementById('dnd-list'); const items = [...list.children]; const targetIdx = +e.currentTarget.dataset.idx; if(dndDragIdx!==targetIdx){ const el = items[dndDragIdx]; items.splice(dndDragIdx,1); items.splice(targetIdx,0,el); items.forEach((item,i)=>{item.dataset.idx=i;list.appendChild(item);}); } document.querySelectorAll('.dnd-item').forEach(i=>{i.classList.remove('drag-over','dragging');}); }\nfunction dndEnd(e) { document.querySelectorAll('.dnd-item').forEach(i=>i.classList.remove('dragging','drag-over')); }\n\n// ── KANBAN ────────────────────────────────────────────────────────────────\nlet kbDragging = null;\nfunction kanbanStart(e) { kbDragging = e.currentTarget; e.currentTarget.classList.add('dragging'); }\nfunction kanbanOver(e) { e.preventDefault(); }\nfunction kanbanDrop(e, col) { e.preventDefault(); if(kbDragging){ e.currentTarget.querySelector('.kanban-col').appendChild(kbDragging); kbDragging.classList.remove('dragging'); kbDragging=null; } }\n\n// ── EASING DEMOS ──────────────────────────────────────────────────────────\ndocument.querySelectorAll('.ease-demo').forEach(el => {\n  el.addEventListener('click', () => {\n    const easing = el.dataset.easing;\n    el.style.transition = 'none';\n    el.style.transform = 'translateX(0)';\n    setTimeout(() => {\n      el.style.transition = `transform 0.6s ${easing}`;\n      el.style.transform = 'translateX(40px)';\n      setTimeout(() => {\n        el.style.transition = `transform 0.6s ${easing}`;\n        el.style.transform = 'translateX(0)';\n      }, 700);\n    }, 20);\n  });\n});\n\n\n// ══ THEME SWITCH (page) ══════════════════════════════════════════════════\nfunction setPageTheme(theme) {\n  document.documentElement.setAttribute('data-theme', theme);\n  document.querySelectorAll('[data-theme-set]').forEach(b => b.classList.toggle('active', b.dataset.themeSet === theme));\n  try { localStorage.setItem('mannyx-ds-theme', theme); } catch (e) {}\n  // les pickers dessinent leur cadran avec une couleur résolue : redessiner\n  [window.tp_main, window._dtpTp].forEach(p => { try { p && p.render && p.render(); } catch (e) {} });\n  [window.dp, window.drp, window._dtpCal].forEach(p => { try { p && p.render && p.render(); } catch (e) {} });\n}\ndocument.addEventListener('click', e => {\n  const b = e.target.closest('[data-theme-set]');\n  if (b) setPageTheme(b.dataset.themeSet);\n});\ntry {\n  const saved = localStorage.getItem('mannyx-ds-theme');\n  if (saved === 'dark' || saved === 'light') setPageTheme(saved);\n} catch (e) {}\n\n\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
