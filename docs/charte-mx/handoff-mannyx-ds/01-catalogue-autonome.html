  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ont-family: 'Geist';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"a6dfb964-aa78-430b-93bd-a3961eecfaff\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n/* ══ SOURCE OF TRUTH — tokens \"Éditorial mono\" (handoff deal-editorial-mono) ══\n   Light = thème par défaut de cette page. Dark = thème par défaut du drawer deal.\n   Toute couleur de composant dérive de ces deux jeux : ne pas réintroduire de hex. */\n:root, html[data-theme=\"light\"], .scope-light {\n  --scrim:       #DADBE0;\n  --surface:     #FFFFFF;\n  --surface2:    #F6F6F8;\n  --text:        #101114;\n  --text2:       #4A4D57;\n  --text3:       #82858F;\n  --border:      #E2E3E9;\n  --band:        #F5C518;\n  --bandText:    #14110A;\n  --chipBg:      #F1F2F5;\n  --chipText:    #4A4D57;\n  --inputBg:     #FFFFFF;\n  --inputBorder: #CBCDD6;\n  --toggleOff:   #E3E4EA;\n  --accent:      #5A46D6;\n  --accent-rgb:  90,70,214;\n  --danger:      #D6273D;\n  --mutedBox:    #F6F6F8;\n  --dashed:      #CBCDD6;\n  --scrimOverlay: rgba(16,17,20,0.55);\n  /* dérivés — aliases consommés par les composants de cette page */\n  --bg:          var(--scrim);\n  --border2:     color-mix(in srgb, var(--border) 60%, transparent);\n  --text-muted:  var(--text2);\n  --text-sub:    var(--text3);\n  --accent-2:    color-mix(in srgb, var(--accent) 78%, #ffffff);\n  --accent-deep: color-mix(in srgb, var(--accent) 72%, #000000);\n  --accent-lt:   rgba(var(--accent-rgb), 0.09);\n  --accent-sec:  var(--band);\n  --red:         var(--danger);\n  --amber:       var(--band);\n  --green:       #0F9D6E;\n  --cyan:        #0B7FA8;\n  --pink:        #C42678;\n  --radius:      6px;\n  --radius-sm:   4px;\n  --shadow:      0 1px 2px rgba(16,17,20,0.05), 0 2px 10px rgba(16,17,20,0.05);\n  --shadow-lg:   0 4px 16px rgba(16,17,20,0.1), 0 16px 48px rgba(16,17,20,0.12);\n  --ease-spring: cubic-bezier(.2,.8,.3,1.3);\n  /* typographie — tokens, à changer ici et nulle part ailleurs.\n     Pas de police mono dans le système : --font-mono est conservé comme point\n     d'accroche sémantique (données chiffrées) mais rend dans la pile UI.\n     L'alignement des colonnes de chiffres est assuré par font-variant-numeric. */\n  --font-display: 'Geist', ui-sans-serif, system-ui, sans-serif;\n  --font-ui:      'Geist', ui-sans-serif, system-ui, sans-serif;\n  --font-mono:    var(--font-ui);\n}\nhtml[data-theme=\"dark\"], .scope-dark {\n  --scrim:       #191B21;\n  --surface:     #14161D;\n  --surface2:    #1B1E27;\n  --text:        #F5F6F8;\n  --text2:       #B4B7C0;\n  --text3:       #7D818C;\n  --border:      #282C37;\n  --band:        #F0B429;\n  --bandText:    #14110A;\n  --chipBg:      #1B1E27;\n  --chipText:    #B4B7C0;\n  --inputBg:     #191C24;\n  --inputBorder: #2E323F;\n  --toggleOff:   #2E323F;\n  --accent:      #8672F5;\n  --accent-rgb:  134,114,245;\n  --danger:      #FF6B6B;\n  --mutedBox:    #191C24;\n  --dashed:      #2E323F;\n  --scrimOverlay: rgba(6,7,10,0.68);\n  --accent-lt:   rgba(var(--accent-rgb), 0.16);\n  --green:       #3DD9A5;\n  --cyan:        #4FC9E8;\n  --pink:        #FF6FA8;\n  --shadow:      0 1px 2px rgba(0,0,0,0.4), 0 2px 10px rgba(0,0,0,0.35);\n  --shadow-lg:   0 4px 16px rgba(0,0,0,0.5), 0 16px 48px rgba(0,0,0,0.55);\n}\nh1,h2,h3,.section-title,.picker-time-display,.cal-month-btn,.mx-dr-title{font-family:var(--font-display);}\nhtml { font-family: var(--font-ui); font-size: 14px; background: var(--bg); color: var(--text); }\nbody { min-height: 100vh; }\n::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }\ninput, select, textarea, button { font-family: inherit; }\n\n/* ─── PICKERS ─────────────────────────────────────────────── */\n.picker-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); width: 280px; height: 320px; display: flex; flex-direction: column; }\n.picker-card-fixed { width: 280px; min-height: 370px; display: flex; flex-direction: column; }\n.picker-header { background: linear-gradient(135deg, var(--accent), var(--accent-2)); padding: 12px 18px 10px; }\n.picker-time-display { font-size: 36px; font-weight: 800; color: #fff; letter-spacing: -0.04em; text-align: center; line-height: 1; cursor: default; }\n.tp-input { background: transparent; border: none; outline: none; color: #fff; font-size: 36px; font-weight: 800; letter-spacing: -0.04em; font-family: inherit; padding: 0; transition: opacity 0.15s; }\n.tp-input::selection { background: rgba(255,255,255,0.3); }\n.tp-input:focus { opacity: 1 !important; }\n.picker-tabs { display: flex; gap: 6px; margin-top: 8px; justify-content: center; }\n.picker-tab { padding: 4px 14px; border-radius:4px; font-size: 11px; font-weight: 600; cursor: pointer; color: rgba(255,255,255,0.7); transition: all 0.15s; }\n.picker-tab.active { background: rgba(255,255,255,0.2); color: #fff; }\n.picker-clock { padding: 8px; display: flex; justify-content: center; }\n.picker-footer { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--border); margin-top: auto; }\n.picker-btn-ghost { background: none; border: none; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-muted); font-family: inherit; padding: 6px 8px; border-radius: 6px; transition: all 0.12s; }\n.picker-btn-ghost:hover { background: var(--surface2); color: var(--text); }\n.picker-btn-ok { background: var(--accent); color: #fff; border: none; cursor: pointer; font-size: 13px; font-weight: 700; font-family: inherit; padding: 7px 18px; border-radius:4px; }\n/* Calendar */\n.cal-header { background: linear-gradient(135deg, var(--accent), var(--accent-2)); padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }\n.cal-nav { background: rgba(255,255,255,0.15); border: none; cursor: pointer; width: 28px; height: 28px; border-radius:4px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; transition: background 0.12s; flex-shrink:0; }\n.cal-nav:hover { background: rgba(255,255,255,0.25); }\n.cal-month-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); cursor: pointer; border-radius:4px; padding: 4px 10px; font-size: 14px; font-weight: 700; color: #fff; font-family: var(--font-ui); letter-spacing: -0.01em; display: flex; align-items: center; transition: background 0.12s; }\n.cal-month-btn:hover { background: rgba(255,255,255,0.22); }\n.month-cell { padding: 8px 4px; text-align: center; font-size: 12px; font-weight: 600; color: var(--text-muted); border-radius:4px; cursor: pointer; transition: all 0.12s; }\n.month-cell:hover { background: var(--accent); color: #fff; transform: scale(1.05); }\n.month-cell.month-sel { background: var(--accent); color: #fff; }\n.cal-grid { padding: 10px 12px; flex: 1; }\n.cal-day-header { display: grid; grid-template-columns: repeat(7,1fr); margin-bottom: 4px; }\n.cal-dh { font-size: 10px; font-weight: 700; text-align: center; color: var(--text-muted); padding: 3px 0; }\n.cal-days { display: grid; grid-template-columns: repeat(7,1fr); gap: 1px; }\n.cal-day { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 11px; border-radius: 4px; cursor: pointer; transition: all 0.15s; margin: 0 auto; font-weight: 500; color: var(--text); }\n.cal-day:hover { background: var(--accent-lt); color: var(--accent); }\n.cal-day.other-month { color: var(--text-sub); }\n.cal-day.today { font-weight: 700; color: var(--accent); }\n.cal-day.selected { background: var(--accent); color: #fff !important; box-shadow: 0 2px 8px rgba(var(--accent-rgb),0.4); }\n.cal-day.range-mid { background: var(--accent-lt); border-radius: 0; color: var(--accent); }\n.cal-day.range-start { background: var(--accent); color: #fff; border-radius: 4px 0 0 4px; }\n.cal-day.range-end { background: var(--accent); color: #fff; border-radius: 0 4px 4px 0; }\n/* Tags */\n.tag-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius:4px; background: var(--accent-lt); color: var(--accent); font-size: 12px; font-weight: 600; }\n/* Avatars */\n.av { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-left: -8px; border: 2px solid var(--surface); flex-shrink: 0; cursor: pointer; transition: transform 0.1s; position: relative; }\n.av:first-child { margin-left: 0; }\n.av:hover { transform: translateY(-2px); z-index: 10 !important; }\n/* Pagination */\n.pg-btn { width: 30px; height: 30px; border-radius:4px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-family: inherit; transition: all 0.12s; }\n.pg-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-lt); transform: translateY(-2px); }\n.pg-active { background: var(--accent) !important; color: #fff !important; border-color: var(--accent) !important; }\n/* Steps */\n.step { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }\n.step-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text-muted); transition: all 0.15s; }\n.step.done .step-dot { background: var(--accent-lt); border-color: var(--accent); color: var(--accent); font-size: 13px; }\n.step.active .step-dot { background: var(--accent); border-color: var(--accent); color: #fff; }\n.step-lbl { font-size: 10px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }\n.step.done .step-lbl, .step.active .step-lbl { color: var(--accent); }\n.step-line { flex: 1; height: 2px; background: var(--border); margin-top: -16px; min-width: 20px; transition: background 0.15s; }\n.done-line { background: var(--accent); }\n\n/* ─── PREVIEW TRIGGERS ────────────────────────────────────── */\n.preview-trigger { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; position: relative; transition: transform 0.2s var(--ease-spring), box-shadow 0.2s, border-color 0.2s; box-shadow: var(--shadow); overflow: hidden; }\n.preview-trigger:hover { border-color: var(--accent); box-shadow: var(--shadow-lg); transform: translateY(-3px); }\n.preview-trigger:hover .pt-hint { opacity: 1; }\n.pt-hint { position: absolute; bottom: 8px; right: 10px; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-lt); padding: 3px 9px; border-radius:4px; opacity: 0; transition: opacity 0.15s; }\n\n/* ─── PREVIEW MODAL ───────────────────────────────────────── */\n.pv-overlay { display: none; position: fixed; inset: 0; background: rgba(10,10,30,0.55); backdrop-filter: blur(6px); z-index: 2000; align-items: center; justify-content: center; }\n.pv-overlay.open { display: flex; }\n.pv-modal { background: var(--surface); border-radius:4px; box-shadow: 0 24px 64px rgba(0,0,0,0.18); max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; animation: pvIn 0.2s ease; }\n@keyframes pvIn { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }\n.pv-close { width: 30px; height: 30px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--text-muted); transition: all 0.12s; flex-shrink: 0; }\n.pv-close:hover { background: var(--border); color: var(--text); }\n\n/* ── SKELETON ───────────────────────────────────────────── */\n.skel { background: linear-gradient(90deg, var(--border) 25%, rgba(var(--accent-rgb),0.08) 50%, var(--border) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 3px; }\n@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }\n\n/* ── DROPDOWN ───────────────────────────────────────────── */\n.dropdown-menu { position: absolute; background: var(--surface); border: 1px solid var(--border); border-radius:6px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); z-index: 100; overflow: hidden; min-width: 160px; }\n.dd-item { padding: 8px 14px; font-size: 13px; color: var(--text); cursor: pointer; transition: background 0.1s; }\n.dd-item:hover { background: var(--accent-lt); color: var(--accent); }\n.dd-active { background: var(--accent-lt); color: var(--accent); font-weight: 600; }\n.dd-danger { color: var(--red) !important; }\n.dd-danger:hover { background: rgba(225,29,72,0.08) !important; }\n.dd-sep { height: 1px; background: var(--border); margin: 4px 0; }\n.dd-group-label { padding: 6px 14px 3px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); }\n.ctx-btn { background: none; border: 1px solid var(--border); border-radius: 4px; width: 28px; height: 28px; cursor: pointer; font-size: 14px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-family: inherit; transition: all 0.15s; }\n.ctx-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.08); }\n\n/* ── TOOLTIP ────────────────────────────────────────────── */\n.tt-wrap { position: relative; display: inline-block; }\n.tooltip { position: absolute; background: var(--text); color: #fff; font-size: 11px; font-weight: 500; padding: 5px 10px; border-radius:4px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 200; }\n.tt-wrap:hover .tooltip { opacity: 1; }\n.tt-top { bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%); }\n.tt-bottom { top: calc(100% + 7px); left: 50%; transform: translateX(-50%); }\n.tt-right { left: calc(100% + 7px); top: 50%; transform: translateY(-50%); }\n\n/* ── POPOVER ────────────────────────────────────────────── */\n.popover { position: absolute; background: var(--surface); border: 1px solid var(--border); border-radius:6px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); z-index: 100; padding: 14px; }\n\n/* ── COMMAND PALETTE ────────────────────────────────────── */\n.cmdpal-overlay { display: none; position: fixed; inset: 0; background: rgba(10,10,30,0.6); backdrop-filter: blur(8px); z-index: 4000; align-items: flex-start; justify-content: center; padding-top: 15vh; }\n.cmdpal-overlay.open { display: flex; }\n.cmdpal-box { background: var(--surface); border: 1px solid var(--border); border-radius:6px; box-shadow: 0 24px 64px rgba(0,0,0,0.2); width: 560px; max-width: 95vw; overflow: hidden; animation: pvIn 0.18s ease; }\n.cmdpal-input { width: 100%; border: none; outline: none; padding: 18px 20px; font-size: 16px; font-family: inherit; background: transparent; color: var(--text); border-bottom: 1px solid var(--border); }\n.cmdpal-section { padding: 6px 0; }\n.cmdpal-section-label { padding: 6px 16px 2px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }\n.cmdpal-item { display: flex; align-items: center; gap: 12px; padding: 9px 16px; cursor: pointer; transition: background 0.1s; }\n.cmdpal-item:hover, .cmdpal-item.cp-active { background: var(--accent-lt); }\n.cmdpal-item:hover .cp-label, .cmdpal-item.cp-active .cp-label { color: var(--accent); }\n.cp-icon { width: 28px; height: 28px; border-radius:4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; }\n.cp-label { font-size: 13px; font-weight: 500; color: var(--text); }\n.cp-sub { font-size: 11px; color: var(--text-muted); margin-left: auto; }\n\n/* ── UPLOAD ZONE ────────────────────────────────────────── */\n.upload-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 32px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; transition: all 0.15s; background: var(--surface); }\n.upload-zone:hover, .upload-zone.dz-over { border-color: var(--accent); background: var(--accent-lt); }\n@keyframes upload-progress { 0%{width:20%} 50%{width:80%} 100%{width:20%} }\n\n/* ── DRAG & DROP ────────────────────────────────────────── */\n.dnd-item { display: flex; align-items: center; gap:10px; padding: 9px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius:5px; cursor: grab; transition: all 0.12s; user-select: none; }\n.dnd-item:hover { border-color: rgba(var(--accent-rgb),0.3); background: var(--surface); }\n.dnd-item.dragging { opacity: 0.4; }\n.dnd-item.drag-over { border-color: var(--accent); background: var(--accent-lt); }\n.kanban-card { transition: all 0.12s; }\n.kanban-card:hover { border-color: rgba(var(--accent-rgb),0.3); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }\n.kanban-card.dragging { opacity: 0.4; }\n\n/* ── EASING DEMO ────────────────────────────────────────── */\n.ease-demo { transition: none; }\nbutton:focus-visible,.input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}\n.dropdown-menu,.popover{border-radius:6px !important;}\n.dd-item:hover{transform:translateX(2px);}\nkbd{border-radius:3px !important;font-family:var(--font-ui);font-variant-numeric:tabular-nums;}\n\n/* ── THEME SWITCH ─────────────────────────────────────────── */\n.theme-switch { display: flex; gap: 4px; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 6px; padding: 4px; flex-shrink: 0; }\n.theme-switch button { all: unset; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 700; padding: 6px 16px; border-radius: 3px; color: var(--text3); transition: background 0.15s, color 0.15s; }\n.theme-switch button:hover { color: var(--text); }\n.theme-switch button.active { background: var(--accent); color: #fff; }\n\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ─── LAYOUT ────────────────────────────────────────────────────────── -->\n<div style=\"display:flex;min-height:100vh;\">\n\n  <!-- Sidebar TOC -->\n  <nav id=\"toc\" style=\"width:200px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);padding:20px 0;\">\n    <div style=\"padding:0 16px 18px;border-bottom:1px solid var(--border);margin-bottom:12px;\">\n      <div style=\"display:flex;align-items:center;gap:9px;\">\n        <div style=\"width:30px;height:30px;border-radius:4px;background:linear-gradient(135deg,var(--accent),var(--green));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;\">M<\u002Fdiv>\n        <div>\n          <div style=\"font-size:13px;font-weight:700;color:var(--text);letter-spacing:-0.02em;\">Mannyx<\u002Fdiv>\n          <div style=\"font-size:10px;color:var(--text-muted);\">UI Components<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"toc-links\" style=\"display:flex;flex-direction:column;gap:1px;padding:0 8px;\"><\u002Fdiv>\n  <\u002Fnav>\n\n  <!-- Main content -->\n  <main style=\"flex:1;overflow-y:auto;padding:40px 48px 80px;\">\n    <div style=\"max-width:960px;margin:0 auto;\">\n\n      <!-- Header -->\n      <div style=\"margin-bottom:48px;\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.2em;color:var(--accent);text-transform:uppercase;margin-bottom:14px;\">— Design System v2<\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap;\">\n          <h1 style=\"font-size:52px;font-weight:700;color:var(--text);letter-spacing:-0.05em;line-height:0.95;font-family:var(--font-display);\">MANNYX<br>COMPONENTS<\u002Fh1>\n          <div class=\"theme-switch\" role=\"group\" aria-label=\"Thème\">\n            <button type=\"button\" data-theme-set=\"light\" class=\"active\">Light<\u002Fbutton>\n            <button type=\"button\" data-theme-set=\"dark\">Dark<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin-top:10px;font-size:15px;color:var(--text-muted);line-height:1.6;\">Éditorial mono · tokens light / dark · Space Grotesk + Manrope + IBM Plex Mono<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- ── TOKENS ──────────────────────────────────────────────────── -->\n      <section id=\"s-tokens\" class=\"comp-section\">\n        <h2 class=\"section-title\">Couleurs &amp; Tokens<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:20px;\">\n          <div class=\"swatch\" style=\"--c:var(--accent);\"><div class=\"sw-box\"><\u002Fdiv><div class=\"sw-lbl\">Accent<\u002Fdiv><\u002Fdiv>\n          <div class=\"swatch\" style=\"--c:var(--accent-2);\"><div class=\"sw-box\"><\u002Fdiv><div class=\"sw-lbl\">Accent+<\u002Fdiv><\u002Fdiv>\n          <div class=\"swatch\" style=\"--c:rgba(var(--accent-rgb),0.08);border:1px solid var(--border);\"><div class=\"sw-box\"><\u002Fdiv><div class=\"sw-lbl\">Accent Lt<\u002Fdiv><\u002Fdiv>\n          <div class=\"swatch\" style=\"--c:var(--green);\"><div class=\"sw-box\"><\u002Fdiv><div class=\"sw-lbl\">Vert<\u002Fdiv><\u002Fdiv>\n          <div class=\"swatch\" style=\"--c:var(--danger);\"><div class=\"sw-box\"><\u002Fdiv><div class=\"sw-lbl\">Rouge<\u002Fdiv><\u002Fdiv>\n          <div class=\"swatch\" style=\"--c:var(--band);\"><div class=\"sw-box\"><\u002Fdiv><div class=\"sw-lbl\">Amber<\u002Fdiv><\u002F var(--shadow-lg);max-height:90vh;overflow-y:auto;max-width:95vw;\"><\u002Fdiv>\n<\u002Fdiv>\n\n<style>\n/* ─── BASE COMPONENTS ─────────────────────────────────────── */\n.comp-section { margin-bottom: 56px; }\n.section-title { font-size: 26px; font-weight: 700; color: var(--text); letter-spacing: -0.04em; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 3px solid var(--accent); display: inline-block; text-transform: uppercase; }\n.subsection-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 10px; }\n.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); transition: transform 0.2s var(--ease-spring), box-shadow 0.2s; }\n.row-wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }\n\n/* ─── SWATCHES ────────────────────────────────────────────── */\n.swatch { text-align: center; }\n.sw-box { width: 100%; height: 40px; border-radius:4px; background: var(--c); margin-bottom: 5px; }\n.sw-lbl { font-size: 10px; color: var(--text-muted); }\n\n/* ─── BUTTONS ─────────────────────────────────────────────── */\n.btn { padding: 7px 14px; border-radius:4px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: var(--font-ui); transition: all 0.12s; letter-spacing: -0.01em; }\n.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 2px 0 var(--accent-deep); }\n.btn-primary:hover { background: var(--accent); box-shadow: 0 4px 12px rgba(var(--accent-rgb),0.4), 0 2px 0 var(--accent-deep); }\n.btn-primary:active { box-shadow: 0 1px 0 var(--accent-deep); }\n.btn-secondary { background: var(--accent-lt); color: var(--accent); border: 1px solid rgba(var(--accent-rgb),0.2); }\n.btn-secondary:hover { background: rgba(var(--accent-rgb),0.14); }\n.btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }\n.btn-ghost:ho rface); flex-shrink: 0; transition: all 0.12s; }\n.checkbox.checked { background: var(--accent); border-color: var(--accent); background-image: url(\"data:image/svg+xml,%3Csvg width='10' height='8' viewBox='0 0 10 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 4l3 3 5-6' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E\"); background-repeat: no-repeat; background-position: center; }\n\n/* ─── TABLE ───────────────────────────────────────────────── */\n.th { padding: 9px 14px; text-align: left; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }\n.td { padding: 11px 14px; font-size: 13px; border-top: 1px solid var(--border); }\n.tr:hover { background: rgba(var(--accent-rgb),0.025); }\n\n/* ─── NAV ─────────────────────────────────────────────────── */\n.nav-item { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 4px; font-size: 13px; color: var(--text-muted); cursor: pointer; transition: all 0.15s; }\n.active-nav { background: var(--accent-lt); color: var(--accent); font-weight: 600; }\n.hover-nav { background: rgba(0,0,0,0.03); color: var(--text); }\n\n/* ─── TOAST ───────────────────────────────────────────────── */\n.toast { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius:6px; background: var(--tlt); border: 1px solid rgba(0,0,0,0.05); }\n\n/* ─── ARTIST CARD ─────────────────────────────────────────── */\n.artist-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; cursor: pointer; transition: transform 0.2s var(--ease-spring), box-shadow 0.2s, border-color 0.2s; box-shadow: var(--shadow); }\n.artist-card:hover { box-shadow: var(--shadow-lg); border-color: var(--accent); transform: translateY(-4px) scale(1.02); }\n .g.querySelectorAll('[role=\"radio\"]')];\n  const opts = all.filter(o => o.getAttribute('aria-disabled') !== 'true');\n  const set = o => all.forEach(x => { const on = x === o; x.classList.toggle('is-on', on); x.setAttribute('aria-checked', on); x.tabIndex = on ? 0 : -1; });\n  opts.forEach(o => {\n    o.addEventListener('click', () => set(o));\n    o.addEventListener('keydown', e => {\n      const d = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];\n      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); set(o); return; }\n      if (!d) return;\n      e.preventDefault();\n      const n = opts[(opts.indexOf(o) + d + opts.length) % opts.length];\n      set(n); n.focus();\n    });\n  });\n});\n\n// ── ACCORDÉON ───────────────────────────────────────────────────────\nfunction accSet(item, open) {\n  item.classList.toggle('is-open', open);\n  item.querySelector('.acc-head').setAttribute('aria-expanded', open);\n}\nfunction accToggle(btn) {\n  const item = btn.closest('.acc-item');\n  const acc = item.closest('.acc');\n  const open = !item.classList.contains('is-open');\n  if (acc.hasAttribute('data-single')) acc.querySelectorAll(':scope > .acc-item.is-open').forEach(i => { if (i !== item) accSet(i, false); });\n  accSet(item, open);\n  const allBtn = document.querySelector('[onclick*=\"' + acc.id + '\"]');\n  if (acc.id && allBtn) { const every = [...acc.children].every(i => i.classList.contains('is-open')); allBtn.dataset.open = every ? '1' : '0'; allBtn.textContent = every ? 'Tout replier' : 'Tout déplier'; }\n}\nfunction accAll(id, btn) {\n  const open = btn.dataset.open !== '1';\n  document.querySelectorAll('#' + id + ' > .acc-item').forEach(i => accSet(i, open));\n  btn.dataset.open = open ? '1' : '0';\n  btn.textContent = open ? 'Tout replier' : 'Tout déplier';\n}\n\n// ── BASCULE LISTE / GRILLE ──────────────────────────────────────────\nfunction vtThumb(vt) {\n  const a = vt.querySelector('button.is-active'), t = vt.querySelector('.vt-thumb');\n  if (a && t) { t.style.left = a.offsetLeft + 'px'; t.style.width = a.offsetWidth + 'px'; }\n}\nfunction vtSelect(vt, v) {\n  vt.querySelectorAll('button').forEach(b => { const on = b.dataset.v === v; b.classList.toggle('is-active', on); b.setAttribute('aria-checked', on); });\n  vtThumb(vt);\n}\nfunction vtInit() {\n  document.querySelectorAll('[data-vt-static]').forEach(vt => {\n    vtThumb(vt);\n    vt.querySelectorAll('button').forEach(b => b.addEventListener('click', () => vtSelect(vt, b.dataset.v)));\n  });\n  const demo = document.getElementById('vt-demo');\n  if (demo) {\n    const vt = demo.querySelector('.vt'), coll = demo.querySelector('.vt-coll');\n    let v = 'grid';\n    try { v = localStorage.getItem('mannyx-ds-view') || 'grid'; } catch (e) {}\n    coll.dataset.view = v;\n    vtSelect(vt, v);\n    vt.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {\n      if (coll.dataset.view === b.dataset.v) return;\n      vtSelect(vt, b.dataset.v);\n      coll.classList.remove('is-swapping'); void coll.offsetWidth;\n      coll.dataset.view = b.dataset.v;\n      coll.classList.add('is-swapping');\n      try { localStorage.setItem('mannyx-ds-view', b.dataset.v); } catch (e) {}\n    }));\n    coll.addEventListener('animationend', e => { if (e.target === coll.lastElementChild) coll.classList.remove('is-swapping'); });\n  }\n  window.addEventListener('resize', () => document.querySelectorAll('.vt').forEach(vtThumb));\n}\nif (document.readyState === 'complete') requestAnimationFrame(vtInit);\nelse window.addEventListener('load', () => requestAnimationFrame(vtInit));\nif (document.fonts) document.fonts.ready.then(() => document.querySelectorAll('.vt').forEach(vtThumb));\n\n// ── TOC ──────────────────────────────────────────────────────────────────\nconst sections = [\n  { id:'s-tokens',  label:'Couleurs & Tokens' },\n  { id:'s-typo',    label:'Typographie' },\n  { id:'s-btns',    label:'Boutons' },\n  { id:'s-badges',  label:'Badges & Statuts' },\n  { id:'s-forms',   label:'Formulaires' },\n  { id:'s-accordion', label:'Accordéons' },\n  { id:'s-viewtoggle', label:'Bascule liste / grille' },\n  { id:'s-cards',   label:'Cartes' },\n  { id:'s-tables',  label:'Tableaux' },\n  { id:'s-nav',     label:'Navigation' },\n  { id:'s-modals',  label:'Modales' },\n  { id:'s-charts',  label:'Graphiques' },\n  { id:'s-empty',   label:'États vides' },\n  { id:'s-toasts',  label:'Notifications' },\n  { id:'s-pickers', label:'Sélecteurs date/heure' },\n  { id:'s-misc',    label:'Autres composants' },\n  { id:'s-previews', label:'Modales de preview' },\n  { id:'s-foundations', label:'Fondations' },\n  { id:'s-dropdowns',   label:'Dropdown & Menus' },\n  { id:'s-overlays',    label:'Tooltip · Popover · Drawer' },\n  { id:'s-cmdpal',      label:'Command Palette' },\n  { id:'s-loading',     label:'Loaders & Upload' },\n  { id:'s-dnd',         label:'Drag & Drop' },\n  { id:'s-mannyx',      label:'Composants Mannyx' },\n  { id:'s-drawer',      label:'Drawer' },\n];\nconst tocEl = document.getElementById('toc-links');\nsections.forEach(s => {\n  const a = document.createElement('a');\n  a.href = '#' + s.id; a.textContent = s.label;\n  tocEl.appendChild(a);\n});\n\n// Active tracking\nconst main = document.querySelector('main');\nmain.addEventListener('scroll', () => {\n  let current = '';\n  sections.forEach(s => {\n    const el = document.getElementById(s.id);\n    if (el && el.offsetTop - main.scrollTop < 120) current = s.id;\n  });\n  tocEl.querySelectorAll('a').forEach(a => {\n    a.classList.toggle('active', a.getAttribute('href') === '#' + current);\n  });\n});\n\n// Smooth scroll\ntocEl.querySelectorAll('a').forEach(a => {\n  a.addEventListener('click', e => {\n    e.preventDefault();\n    const target = document.getElementById(a.getAttribute('href').slice(1));\n    if (target) main.scrollTo({ top: target.offsetTop - 32, behavior: 'smooth' });\n  });\n});\n\n// ── MODALS ────────────────────────────────── rat<\u002Flabel><select class=\"input\"><option>Signé<\u002Foption><option>En attente<\u002Foption><option>Refusé<\u002Foption><\u002Fselect><\u002Fdiv>\n      <div class=\"field\"><label class=\"field-label\">Agent<\u002Flabel><input class=\"input\" value=\"Marc Dupont\"><\u002Fdiv>\n      <div class=\"field\"><label class=\"field-label\">Email agent<\u002Flabel><input class=\"input\" value=\"marc@agency.com\"><\u002Fdiv>\n      <div class=\"field\"><label class=\"field-label\">Tél agent<\u002Flabel><input class=\"input\" value=\"+33 6 12 34 56 78\"><\u002Fdiv>\n      <div class=\"field\"><label class=\"field-label\">Loge assignée<\u002Flabel><select class=\"input\"><option>VIP A<\u002Foption><option>VIP B<\u002Foption><option>Standard<\u002Foption><\u002Fselect><\u002Fdiv>\n      <div class=\"field\" style=\"grid-column:1/-1;\"><label class=\"field-label\">Notes internes<\u002Flabel><textarea class=\"input\" rows=\"3\">Rider technique + transport depuis aéroport GVA. Soundcheck à 18h00.<\u002Ftextarea><\u002Fdiv>\n      <div style=\"grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;padding-top:4px;\">\n        <button onclick=\"closeModal()\" class=\"btn btn-ghost\">Annuler<\u002Fbutton>\n        <button class=\"btn btn-secondary\">Brouillon<\u002Fbutton>\n        <button class=\"btn btn-primary\">Enregistrer<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>` }\n};\n\nfunction openModal(id) {\n  const m = MODAL_CONTENTS[id];\n  if (!m) return;\n  const overlay = document.getElementById('modal-overlay');\n  const container = document.getElementById('modal-container');\n  container.style.width = m.width + 'px';\n  container.innerHTML = `\n    <div style=\"display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);\">\n      <div>\n        <div style=\"font-size:16px;font-weight:800;color:var(--text);letter-spacing:-0.02em;\">${m.title}<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--text-muted);margin-top:2px;\">${m.cols} colonne${m.cols>1?'s':''}<\u002Fdiv>\n      <\u002Fdiv>\n      <button onclick=\"closeModal()\" style=\"width:28px;height:28px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);cursor:pointer;font-size:16px;color:var(--text-muted);display:flex;align-items:center;justify-content:center;\">×<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"padding:22px;\">${m.content}<\u002Fdiv>`;\n  overlay.style.display = 'flex';\n}\n\nfunction closeModal() {\n  document.getElementById('modal-overlay').style.display = 'none';\n}\n\ndocument.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });\n\n// ─── SHARED PICKER CONSTANTS ─────────────────────────────────────────────\nconst MONTHS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];\nconst MONTHS_SHORT = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];\nconst DAYS_FR = ['Lu','Ma','Me','Je','Ve','Sa','Di'];\nconst TODAY = new Date(2026, 4, 4); // 4 mai 2026\n\n// ─── TIME PICKER ─────────────────────────────────────────────────────────\nclass TimePicker {\n  constructor(container, id, onChange) {\n    this.h = 22; this.m = 30; this.mode = 'h';\n    this.onChange = onChange;\n    this.container = container;\n    this.id = id; // unique prefix for element IDs\n    this.dragging = false;\n    this.render();\n  }\n  fmt(v) { return String(v).padStart(2,'0'); }\n  clampH(v){ if(isNaN(v)) return this.h; return Math.max(0,Math.min(23,v)); }\n  clampM(v){ if(isNaN(v)) return this.m; return Math.max(0,Math.min(59,v)); }\n  valFromEvent(e, svgEl) {\n    const rect = svgEl.getBoundingClientRect();\n    const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;\n    const px = (e.touches?e.touches[0].clientX:e.clientX) - cx;\n    const py = (e.touches?e.touches[0].clientY:e.clientY) - cy;\n    let ang = Math.atan2(px, -py); if (ang < 0) ang += 2*Math.PI;\n    if (this.mode === 'm') {\n      // 60 discrete minutes, continuous drag\n      return Math.round(ang / (2*Math.PI) * 60) % 60;\n    } else {\n      // hours 0-23: outer ring = 12-23, inner ring = 0-11, split by radius\n      const dist = Math.hypot(px, py);\n      const hour12 = Math.round(ang / (2*Math.PI) * 12) % 12;\n      const isOuter = dist > 59; // midpoint between innerR(46) and outerR(72)\n      return isOuter ? (hour12 === 0 ? 12 : hour12 + 12) : hour12;\n    }\n  }\n  render() {\n    const A = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || 'currentColor';\n    const cx = 95, cy = 95, outerR = 72, innerR = 46;\n    const isH = this.mode === 'h', cur = isH ? this.h : this.m;\n    let circles = '', texts = '';\n    if (isH) {\n      for (let i = 0; i < 12; i++) {\n        const ang = (i / 12) * 2 * Math.PI;\n        const oVal = i + 12, ox = cx + outerR * Math.sin(ang), oy = cy - outerR * Math.cos(ang), oSel = cur === (oVal===24?12:oVal) || (cur===12 && oVal===24);\n        const sel = cur === oVal;\n        if (sel) { circles += `<line x1=\"${cx}\" y1=\"${cy}\" x2=\"${ox.toFixed(1)}\" y2=\"${oy.toFixed(1)}\" stroke=\"${A}\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"${ox.toFixed(1)}\" cy=\"${oy.toFixed(1)}\" r=\"14\" fill=\"${A}\"/>`; }\n        texts += `<text x=\"${ox.toFixed(1)}\" y=\"${oy.toFixed(1)}\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"12\" font-family=\"Geist, sans-serif\" fill=\"${sel?'#fff':'#8890b8'}\" font-weight=\"${sel?700:400}\" style=\"user-select:none\">${this.fmt(oVal===24?12:oVal)}<\u002Ftext>`;\n        const iVal = i, ix = cx + innerR * Math.sin(ang), iy = cy - innerR * Math.cos(ang), iSel = cur === iVal;\n        if (iSel) { circles += `<line x1=\"${cx}\" y1=\"${cy}\" x2=\"${ix.toFixed(1)}\" y2=\"${iy.toFixed(1)}\" stroke=\"${A}\" stroke-width=\"2\" stroke-linecap=\"round\"/><circle cx=\"${ix.toFixed(1)}\" cy=\"${iy.toFixed(1)}\" r=\"13\" fill=\"${A}\"/>`; }\n        texts += `<text x=\"${ix.toFixed(1)}\" y=\"${iy.toFixed(1)}\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"11\" font-family=\"Geist, sans-serif\" fill=\"${iSel?'#fff':'#aab0d0'}\" font-weight=\"${iSel?700:400}\" style=\"user-select:none\">${this.fmt(iVal)}<\u002Ftext>`;\n      }\n    } else {\n      // Minutes: 12 tick labels (every 5) but needle can point to any of 60 positions\n      for (let i = 0; i < 12; i++) {\n        const val = i * 5;\n        const ang = (val / 60) * 2 * Math.PI;\n        const ox = cx + outerR * Math.sin(ang), oy = cy - outerR * Math.cos(ang);\n        const sel = cur === val;\n        if (sel) circles += `<circle cx=\"${ox.toFixed(1)}\" cy=\"${oy.toFixed(1)}\" r=\"14\" fill=\"${A}\"/>`;\n        texts += `<text x=\"${ox.toFixed(1)}\" y=\"${oy.toFixed(1)}\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"12\" font-family=\"Geist, sans-serif\" fill=\"${sel?'#fff':'#8890b8'}\" font-weight=\"${sel?700:400}\" style=\"user-select:none\">${this.fmt(val)}<\u002Ftext>`;\n      }\n      // Needle always shown at exact minute (even off-tick)\n      const needleAng = (cur / 60) * 2 * Math.PI;\n      const nx = cx + outerR * Math.sin(needleAng), ny = cy - outerR * Math.cos(needleAng);\n      circles = `<line x1=\"${cx}\" y1=\"${cy}\" x2=\"${nx.toFixed(1)}\" y2=\"${ny.toFixed(1)}\" stroke=\"${A}\" stroke-width=\"2\" stroke-linecap=\"round\"/>` + (cur % 5 !== 0 ? `<circle cx=\"${nx.toFixed(1)}\" cy=\"${ny.toFixed(1)}\" r=\"6\" fill=\"${A}\"/>` : '') + circles;\n    }\n    this.container.innerHTML = `\n      <div class=\"picker-header\">\n        <div class=\"picker-time-display\" style=\"display:flex;align-items:center;justify-content:center;gap:2px;\">\n          <input class=\"tp-input\" data-part=\"h\" value=\"${this.fmt(this.h)}\" maxlength=\"2\" inputmode=\"numeric\" style=\"width:1.3em;text-align:right;opacity:${this.mode==='h'?1:0.55}\"/>\n          <span style=\"opacity:0.45;margin:0 1px\">:<\u002Fspan>\n          <input class=\"tp-input\" data-part=\"m\" value=\"${this.fmt(this.m)}\" maxlength=\"2\" inputmode=\"numeric\" style=\"width:1.3em;text-align:left;opacity:${this.mode==='m'?1:0.55}\"/>\n        <\u002Fdiv>\n        <div class=\"picker-tabs\">\n          <div class=\"picker-tab ${this.mode==='h'?'active':''}\" data-mode=\"h\">Heures<\u002Fdiv>\n          <div class=\"picker-tab ${this.mode==='m'?'active':''}\" data-mode=\"m\">Minutes<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"picker-clock\">\n        <svg width=\"156\" height=\"156\" viewBox=\"0 0 190 190\" style=\"cursor:pointer;touch-action:none\">\n          <circle cx=\"${cx}\" cy=\"${cy}\" r=\"85\" fill=\"rgba(var(--accent-rgb),0.05)\"/>\n          ${circles}\n          <circle cx=\"${cx}\" cy=\"${cy}\" r=\"4\" fill=\"${A}\"/>\n          ${texts}\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"picker-footer\">\n        <button class=\"picker-btn-ghost\" data-act=\"clear\">Effacer<\u002Fbutton>\n        <div style=\"display:flex;gap:8px\">\n          <button class=\"picker-btn-ghost\" data-act=\"cancel\">Annuler<\u002Fbutton>\n          <button class=\"picker-btn-ok\" data-act=\"ok\">OK<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n    this._bind();\n  }\n  _bind() {\n    const svg = this.container.querySelector('svg');\n    const setFromEvent = (e) => {\n      const v = this.valFromEvent(e, svg);\n      if (this.mode === 'h') this.h = v; else this.m = v;\n      this.render();\n      if (this.onChange) this.onChange(this.h, this.m);\n    };\n    const start = (e) => { e.preventDefault(); this.dragging = true; setFromEvent(e); };\n    const move  = (e) => { if (this.dragging) { e.preventDefault(); setFromEvent(e); } };\n    const end   = () => {\n      if (this.dragging && this.mode === 'h') { this.mode = 'm'; this.render(); }\n      this.dragging = false;\n    };\n    svg.addEventListener('mousedown', start);\n    svg.addEventListener('mousemove', move);\n    window.addEventListener('mouseup', end);\n    svg.addEventListener('touchstart', start, {passive:false});\n    svg.addEventListener('touchmove', move, {passive:false});\n    svg.addEventListener('touchend', end);\n\n    this.container.querySelectorAll('[data-mode]').forEach(el => el.addEventListener('click', () => this.setMode(el.dataset.mode)));\n    this.container.querySelector('[data-act=\"clear\"]').addEventListener('click', () => this.clear());\n    this.container.querySelector('[data-act=\"cancel\"]').addEventListener('click', () => this.cancel());\n    this.container.querySelector('[data-act=\"ok\"]').addEventListener('click', () => this.ok());\n\n    this.container.querySelectorAll('.tp-input').forEach(inp => {\n      inp.addEventListener('focus', () => { this.mode = inp.dataset.part; this.container.querySelectorAll('.tp-input').forEach(i=>i.style.opacity = i===inp?1:0.55); this.container.querySelectorAll('.picker-tab').forEach(t=>t.classList.toggle('active', t.dataset.mode===inp.dataset.part)); });\n      inp.addEventListener('input', () => { inp.value = inp.value.replace(/[^0-9]/g,'').slice(0,2); });\n      inp.addEventListener('blur', () => this._commitInput(inp));\n      inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });\n    });\n  }\n  _commitInput(inp) {\n    const raw = parseInt(inp.value, 10);\n    if (inp.dataset.part === 'h') this.h = this.clampH(isNaN(raw)?this.h:raw);\n    else this.m = this.clampM(isNaN(raw)?this.m:raw);\n    this.render();\n    if (this.onChange) this.onChange(this.h, this.m);\n  }\n  setMode(m) { this.mode = m; this.render(); this.container.querySelector(`.tp-input[data-part=\"${m}\"]`)?.focus(); }\n  clear() { this.h = 0; this.m = 0; this.render(); if(this.onChange) this.onChange(null, null); }\n  cancel() { this.render(); }\n  ok() { if(this.onChange) this.onChange(this.h, this.m); }\n}\n\n// ─── DATE PICKER ─────────────────────────────────────────────────────────\nclass DatePicker {\n  constructor(container, id, opts={}) {\n    this.today    = new Date(TODAY);\n    this.month    = TODAY.getMonth();   // Mai = 4\n    this.year     = TODAY.getFullYear();\n    this.selected = opts.range ? null : new Date(TODAY);\n    this.range     = opts.range || false;\n    this.rangeStart = opts.range ? new Date(2026,4,11) : null;\n    this.rangeEnd   = opts.range ? new Date(2026,4,15) : null;\n    this.container  = container;\n    this.id         = id;\n    this.onChange   = opts.onChange || null;\n    this.view       = 'days'; // 'days' | 'months' | 'years'\n    this.render();\n  }\n  nav(dir) { this.month += dir; if(this.month>11){this.month=0;this.year++;} if(this.month<0){this.month=11;this.year--;} this.render(); }\n  clickDay(dateStr) {\n    const date = new Date(dateStr);\n    if (!this.range) { this.selected = date; this.render(); if(this.onChange) this.onChange(date); return; }\n    if (!this.rangeStart || (this.rangeStart && this.rangeEnd)) { this.rangeStart = date; this.rangeEnd = null; }\n    else { if(date < this.rangeStart){this.rangeEnd=this.rangeStart;this.rangeStart=date;}else{this.rangeEnd=date;} }\n    this.render();\n  }\n  setMonthYear(m, y) { this.month = m; this.year = y; this.view = 'days'; this.render(); }\n  render() {\n    if (this.view === 'months') { this._renderMonthPicker(); return; }\n    if (this.view === 'years')  { this._renderYearPicker();  return; }\n    const firstDay = new Date(this.year, this.month, 1);\n    const startDOW = (firstDay.getDay() + 6) % 7;\n    const dim = new Date(this.year, this.month+1, 0).getDate();\n    const dimPrev = new Date(this.year, this.month, 0).getDate();\n    const totalCells = Math.ceil((startDOW + dim) / 7) * 7;\n    let cells = '';\n    for (let i = 0; i < totalCells; i++) {\n      let d, mo, yr, other = false;\n      if (i < startDOW) { d = dimPrev - startDOW + i + 1; mo = this.month-1; yr = this.year; if(mo<0){mo=11;yr--;} other=true; }\n      else if (i >= startDOW + dim) { d = i - startDOW - dim + 1; mo = this.month+1; yr = this.year; if(mo>11){mo=0;yr++;} other=true; }\n      else { d = i - startDOW + 1; mo = this.month; yr = this.year; }\n      const date = new Date(yr, mo, d);\n      const ds = `${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;\n      let cls = 'cal-day';\n      if (other) cls += ' other-month';\n      if (!other && d===this.today.getDate() && this.month===this.today.getMonth() && this.year===this.today.getFullYear()) cls += ' today';\n      if (!this.range && this.selected && date.toDateString()===this.selected.toDateString()) cls += ' selected';\n      if (this.range && this.rangeStart && this.rangeEnd) {\n        const t=date.getTime(), s=this.rangeStart.getTime(), e=this.rangeEnd.getTime();\n        if(t===s) cls+=' range-start'; else if(t===e) cls+=' range-end'; else if(t>s&&t<e) cls+=' range-mid';\n      } else if (this.range && this.rangeStart && date.toDateString()===this.rangeStart.toDateString()) cls += ' selected';\n      cells += `<div class=\"${cls}\" data-date=\"${ds}\">${d}<\u002Fdiv>`;\n    }\n    const hint = this.range ? (this.rangeStart && !this.rangeEnd ? '2ᵉ clic → date de fin' : '1ᵉʳ clic → date de début') : '';\n    this.container.innerHTML = `\n      <div class=\"cal-header\">\n        <button class=\"cal-nav\" data-nav=\"-1\">‹<\u002Fbutton>\n        <button class=\"cal-month-btn\" title=\"Choisir mois / année\">\n          ${MONTHS_FR[this.month]} ${this.year}\n          <svg width=\"10\" height=\"10\" viewBox=\"0 0 10 10\" fill=\"none\" style=\"margin-left:4px;opacity:0.7\"><path d=\"M2 3.5l3 3 3-3\" stroke=\"white\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><\u002Fsvg>\n        <\u002Fbutton>\n        <button class=\"cal-nav\" data-nav=\"1\">›<\u002Fbutton>\n      <\u002Fdiv>\n      ${hint?`<div style=\"font-size:10px;color:var(--text-muted);text-align:center;padding:4px 0 0;background:var(--surface);\">${hint}<\u002Fdiv>`:''}\n      <div class=\"cal-grid\">\n        <div class=\"cal-day-header\">${DAYS_FR.map(d=>`<div class=\"cal-dh\">${d}<\u002Fdiv>`).join('')}<\u002Fdiv>\n        <div class=\"cal-days\">${cells}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"picker-footer\">\n        <button class=\"picker-btn-ghost\" data-clear=\"1\">Effacer<\u002Fbutton>\n        <div style=\"display:flex;gap:8px\">\n          <button class=\"picker-btn-ghost\" data-cancel=\"1\">Annuler<\u002Fbutton>\n          <button class=\"picker-btn-ok\" data-ok=\"1\">OK<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n    this._bindEvents();\n  }\n  _renderMonthPicker() {\n    this.container.innerHTML = `\n      <div class=\"cal-header\">\n        <button class=\"cal-nav\" data-ynav=\"-1\">‹<\u002Fbutton>\n        <button class=\"cal-month-btn\" data-toYears=\"1\">${this.year} <svg width=\"10\" height=\"10\" viewBox=\"0 0 10 10\" fill=\"none\" style=\"margin-left:4px;opacity:0.7\"><path d=\"M2 3.5l3 3 3-3\" stroke=\"white\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><\u002Fsvg><\u002Fbutton>\n        <button class=\"cal-nav\" data-ynav=\"1\">›<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:14px;\">\n        ${MONTHS_SHORT.map((m,i)=>`<div class=\"month-cell ${i===this.month?'month-sel':''}\" data-month=\"${i}\">${m}<\u002Fdiv>`).join('')}\n      <\u002Fdiv>`;\n    this.container.querySelector('[data-toYears]')?.addEventListener('click', ()=>{this.view='years';this.render();});\n    this.container.querySelector('[data-ynav=\"-1\"]')?.addEventListener('click', ()=>{this.year--;this.render();});\n    this.container.querySelector('[data-ynav=\"1\"]')?.addEventListener('click', ()=>{this.year++;this.render();});\n    this.container.querySelectorAll('.month-cell').forEach(el=>{\n      el.addEventListener('click',()=>{ this.month=+el.dataset.month; this.view='days'; this.render(); });\n    });\n  }\n  _renderYearPicker() {\n    const base = Math.floor(this.year/12)*12;\n    const years = Array.from({length:12},(_,i)=>base+i);\n    this.container.innerHTML = `\n      <div class=\"cal-header\">\n        <button class=\"cal-nav\" data-ydecade=\"-1\">‹<\u002Fbutton>\n        <button class=\"cal-month-btn\" data-backToMonths=\"1\">${base} – ${base+11}<\u002Fbutton>\n        <button class=\"cal-nav\" data-ydecade=\"1\">›<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:14px;\">\n        ${years.map(y=>`<div class=\"month-cell ${y===this.year?'month-sel':''}\" data-year=\"${y}\">${y}<\u002Fdiv>`).join('')}\n      <\u002Fdiv>`;\n    this.container.querySelector('[data-backToMonths]')?.addEventListener('click',()=>{this.view='months';this.render();});\n    this.container.querySelector('[data-ydecade=\"-1\"]')?.addEventListener('click',()=>{this.year-=12;this.render();});\n    this.container.querySelector('[data-ydecade=\"1\"]')?.addEventListener('click',()=>{this.year+=12;this.render();});\n    this.container.querySelectorAll('[data-year]').forEach(el=>{\n      el.addEventListener('click',()=>{this.year=+el.dataset.year;this.view='months';this.render();});\n    });\n  }\n  _bindEvents() {\n    this.container.querySelector('.cal-month-btn')?.addEventListener('click',()=>{this.view='months';this.render();});\n    this.container.querySelector('[data-nav=\"-1\"]')?.addEventListener('click',()=>this.nav(-1));\n    this.container.querySelector('[data-nav=\"1\"]')?.addEventListener('click',()=>this.nav(1));\n    this.container.querySelector('[data-clear]')?.addEventListener('click',()=>{\n      this.selected=null; this.rangeStart=null; this.rangeEnd=null; this.render(); if(this.onChange)this.onChange(null);\n    });\n    this.container.querySelector('[data-cancel]')?.addEventListener('click',()=>this.render());\n    this.container.querySelector('[data-ok]')?.addEventListener('click',()=>{\n      if(this.onChange) this.onChange(this.range?{start:this.rangeStart,end:this.rangeEnd}:this.selected);\n    });\n    this.container.querySelectorAll('.cal-day').forEach(el=>{\n      el.addEventListener('click',()=>{ if(el.dataset.date) this.clickDay(el.dataset.date); });\n    });\n  }\n}\n\n// ─── INSTANCES ────────────────────────────────────────────────────────────\nconst tp_main = new TimePicker(document.getElementById('tp-root'), 'main', (h,m) => {\n  if(h!=null){\n    document.getElementById('dtp-time-label').textContent = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');\n    document.getElementById('dtp-time-label').style.color = 'var(--text)';\n    updateDTPResult();\n  }\n});\nwindow['tp_main'] = tp_main;\n// legacy alias so existing onclick=\"tp.setMode\" still works if any remain\nconst tp = tp_main;\n\nconst dp = new DatePicker(document.getElementById('dp-root'), 'dp', {\n  onChange: d => {\n    document.getElementById('dtp-date-label').textContent = d ? d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}) : 'Sélectionner';\n    document.getElementById('dtp-date-label').style.color = d ? 'var(--text)' : '#8890b8';\n    updateDTPResult();\n  }\n});\n\nconst drp = new DatePicker(document.getElementById('drp-root'), 'drp', { range: true });\n\nfunction dpNav(dir) { dp.nav(dir); }\nfunction dpClick(el, dateStr) { dp.clickDay(dateStr); }\nfunction dpClear() { dp.selected=null; dp.render(); if(dp.onChange) dp.onChange(null); }\nfunction dpOk() {}\n\n// DRP — handled entirely by the new DatePicker._bindEvents() via clickDay()\n\n// DateTime picker\nlet _dtpCal = null, _dtpTp = null;\nfunction openDTP(mode) {\n  const pop = document.getElementById('dtp-popup');\n  if (mode === 'date') {\n    if (pop.style.display !== 'none' && pop._mode === 'date') { pop.style.display = 'none'; return; }\n    pop.style.display = 'block'; pop._mode = 'date';\n    pop.innerHTML = '<div class=\"picker-card\" id=\"dtp-cal-inner\"><\u002Fdiv>';\n    _dtpCal = new DatePicker(document.getElementById('dtp-cal-inner'), 'dtpcal', {\n      onChange: d
